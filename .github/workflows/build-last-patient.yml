name: Build The Last Patient Exploration

on:
  push:
    branches: [main]
    paths:
      - "the-last-patient/**"
      - ".github/workflows/build-last-patient.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-last-patient
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build exploration game
        run: npm run build
      - name: Upload playable web build
        uses: actions/upload-artifact@v4
        with:
          name: the-last-patient-exploration-web
          path: the-last-patient/dist/
          if-no-files-found: error
          retention-days: 14
